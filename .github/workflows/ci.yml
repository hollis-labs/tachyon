name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.10'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build, typecheck, lint and test the UI workspace
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm test
          npm run build
      - run: go mod tidy
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...
      - run: make plugins
