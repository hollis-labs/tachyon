name: ci

on:
  push:
    branches: [main]
  # Every pull request, including ones stacked on another branch: a base filter of
  # main left stacked PRs with no checks at all.
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.10'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build, typecheck, lint and test the UI workspace
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run lint:planner
          npm test
          npm run build
      - run: go mod tidy
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...
      - run: make plugins

  # The Substrate port (docs/substrate-port-plan.md): a separate Go module in next/, built and
  # checked on its own. The root job above does not descend into it (a nested module).
  # The same Go suite on Postgres (port plan section 14, slice PG1). Every test that opens a database
  # gets a fresh schema on this service; a test that cannot run on Postgres skips with its reason, and
  # SUBSTRATE_REQUIRE_POSTGRES=1 makes a Postgres-only test fail rather than skip if the DSN is lost.
  # The container trusts local connections, so the DSN carries no password.
  next-postgres:
    name: next (Substrate port, Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: next
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: tachyon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SUBSTRATE_TEST_POSTGRES_DSN: postgres://postgres@localhost:5432/tachyon_test?sslmode=disable
      SUBSTRATE_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: next/go.mod
          cache-dependency-path: next/go.sum
      - run: go test -race ./...

  next:
    name: next (Substrate port)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: next
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: next/go.mod
          cache-dependency-path: next/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: next/web/package-lock.json
      # The SPA (slice G1) is built first: internal/webui embeds next/web's output, and the binary the
      # browser suite starts must carry it.
      - name: SPA (install, manifest is current, typecheck, lint, unit tests, build)
        working-directory: next/web
        run: |
          npm ci
          # The committed manifest is generated from ui/app.json and the module set; regenerate it
          # and fail if it differs, as for the committed wiring file.
          go tool substrate frontend -f ../cmd/tachyon/substrate.yaml -o src/generated
          git diff --exit-code -- src/generated
          npm run typecheck
          npm run lint
          npm test
          npm run build
      - run: go vet ./...
      - run: go test -race ./...
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.4
          working-directory: next
      - name: Pins match the Substrate BOM
        run: go tool substrate pins check --app .
      # Scoped to next/ at this commit (the director's ruling on CW-20261114-0121): the old tree and its
      # history are pinned by an allowlist on main (PR #702), which never applies here. next/ as committed
      # is archived into a throwaway repository and scanned with --no-allowlist, so an allow file under
      # next/ or merged from main cannot mask a finding. scan-public exits 1 on any finding and 2 when
      # it cannot run; either fails this step (set -e).
      - name: Public hygiene (next/ at this commit, no allowlist)
        run: |
          set -euo pipefail
          scan=$(mktemp -d)
          git -C .. archive HEAD next | tar -x -C "$scan"
          git -C "$scan" init -q
          git -C "$scan" add -A
          git -C "$scan" -c user.name=scan -c user.email=scan@invalid commit -qm "next/ at $GITHUB_SHA"
          go tool substrate scan-public --repo "$scan" --ref HEAD --no-allowlist
      # The browser proof: the real binary (with the SPA embedded) on a throwaway data directory.
      - name: Build the binary the browser suite starts
        run: go build -o tachyon ./cmd/tachyon
      - name: Install the browser
        working-directory: next/web
        run: npx playwright install --with-deps chromium
      - name: Browser suite
        working-directory: next/web
        env:
          # CI installs the bundled Chromium; the config defaults to the system Chrome channel.
          PLAYWRIGHT_CHANNEL: chromium
          # Run directories are made fresh (mkdtemp) under here; nothing is ever wiped.
          TACHYON_E2E_DIR: ${{ runner.temp }}
        run: npm run test:e2e
      - name: Browser suite screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: next-web-e2e
          path: |
            ${{ runner.temp }}/tachyon-e2e-*/shots
            ${{ runner.temp }}/tachyon-e2e-*/results
          if-no-files-found: ignore
