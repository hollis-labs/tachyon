openapi: 3.0.3
info:
  title: Tachyon Approvals backend
  version: "1"
  description: |
    Additive routes and projection fields on the existing inbox prefix
    /api/plugins/console/v1/approval-inbox. Session, status, elevate and de-elevate are unchanged
    (real bridge). Same cookie, same-origin rule and guards as today. Writes need an operator session;
    batch, secrets, medium-risk and destructive resolves need elevated operator access.
    Design: tesseract key design_tachyon_approvals_backend_20261030. Stub: TACHYON_APPROVALS_STUBS=1.
servers:
  - url: /api/plugins/console/v1/approval-inbox
paths:
  /inbox:
    get:
      summary: Queue (pending) and recent history, with the projection fields
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [pending, history]}}
        - {name: group, in: query, schema: {$ref: '#/components/schemas/Group'}}
        - {name: risk, in: query, schema: {$ref: '#/components/schemas/Risk'}}
        - {name: batchable, in: query, schema: {type: string, enum: ["1"]}}
        - {name: q, in: query, description: Matches title, summary, requester and id only (not body text), schema: {type: string}}
        - {name: order, in: query, description: "urgency (default): deferred last, expires_at ascending, risk descending, oldest first", schema: {type: string, enum: [urgency, created]}}
        - {name: requester, in: query, schema: {type: string}}
        - {name: history_status, in: query, description: filters the history side, schema: {type: string, enum: [approved, denied, answered, expired, withdrawn, failed, superseded]}}
        - {name: pending_before, in: query, description: item-id cursor from next_pending, schema: {type: string}}
        - {name: history_before, in: query, description: item-id cursor from next_history, schema: {type: string}}
        - {name: cursor, in: query, description: alias for pending_before (or history_before with status=history), schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/Inbox'}}}}
  /items/{id}:
    get:
      summary: One item with the projection
      parameters: [{$ref: '#/components/parameters/id'}]
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/Item'}}}}
        "404": {$ref: '#/components/responses/Error'}
  /items/{id}/audit:
    get:
      summary: The item's decision events (collapsed "Decision audit" section)
      parameters: [{$ref: '#/components/parameters/id'}]
      responses:
        "200": {description: ok, content: {application/json: {schema: {type: object, properties: {item_id: {type: string}, events: {type: array, items: {$ref: '#/components/schemas/Event'}}}}}}}
  /items/{id}/present:
    post:
      summary: Mark presented (unchanged)
      parameters: [{$ref: '#/components/parameters/id'}]
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/Item'}}}}
  /items/{id}/resolve:
    post:
      summary: Decide one item
      description: |
        Checks in order: body, already resolved (409 already_resolved with the existing outcome), revision
        (409 stale_revision with the actual revision), operator
        access for medium/high/destructive (403 operator_access_required), typed confirmation for an approved
        item that has confirm (every high-class item and every destructive one) (422 confirmation_required, case-sensitive, trimmed), alternative_id, reason for deny
        when reason_required (422 reason_required), secret answers must be secret_refs (422 invalid_secret_ref).
      parameters: [{$ref: '#/components/parameters/id'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ResolveRequest'}}}
      responses:
        "200": {description: resolved, content: {application/json: {schema: {$ref: '#/components/schemas/ResolveResult'}}}}
        "403": {$ref: '#/components/responses/Error'}
        "409": {$ref: '#/components/responses/Error'}
        "422": {$ref: '#/components/responses/Error'}
  /items/{id}/defer:
    post:
      summary: Snooze (overlay only; the item can still expire or be decided elsewhere)
      parameters: [{$ref: '#/components/parameters/id'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/DeferRequest'}}}
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/DeferResult'}}}}
        "409": {$ref: '#/components/responses/Error'}
    delete:
      summary: Remove the snooze
      parameters: [{$ref: '#/components/parameters/id'}]
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/DeferResult'}}}}
  /batch/resolve:
    post:
      summary: Resolve up to 25 items in order; not a transaction
      description: |
        Needs elevated operator access for the whole batch. Each item goes through the same checks as a single
        resolve; one failure never stops the next. Same batch_id + same body replays the stored response;
        a different body is 409 batch_id_reuse.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/BatchRequest'}}}
      responses:
        "200": {description: per-item results, content: {application/json: {schema: {$ref: '#/components/schemas/BatchResult'}}}}
        "403": {$ref: '#/components/responses/Error'}
        "409": {$ref: '#/components/responses/Error'}
  /history:
    get:
      summary: Decision timeline with reasons
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [approved, denied, answered, expired, withdrawn]}}
        - {name: requester, in: query, schema: {type: string}}
        - {name: q, in: query, schema: {type: string}}
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, schema: {type: string, format: date-time}}
        - {name: limit, in: query, schema: {type: integer}}
        - {name: cursor, in: query, schema: {type: string}}
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/History'}}}}
  /events:
    get:
      summary: Server-sent events (primary push; polling /inbox every 10 s stays as fallback)
      description: |
        Event types: inbox.changed, item.created, item.updated, item.resolved, item.expired, item.deferred,
        item.undeferred, resync. Ids are a replayable sequence (Last-Event-ID or ?after=). An id the ring no
        longer holds gets one resync event: refetch /inbox. Data is JSON with type, at and the event fields.
      parameters:
        - {name: after, in: query, schema: {type: integer}}
        - {name: once, in: query, description: stub only; end after the replay, schema: {type: string, enum: ["1"]}}
      responses:
        "200": {description: text/event-stream, content: {text/event-stream: {schema: {type: string}}}}
  /access:
    get:
      summary: Normalized operator-access state (never Tangent shapes)
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/Access'}}}}
  /secrets:
    post:
      summary: Submit a secret value; returns a reference, never the value
      description: |
        Operator-token required. value at most 16 KiB (file upload at most 64 KiB in the real route). The value
        is never returned, logged, stored in the record, digest, events or audit. 503 secrets_unavailable when
        no key is configured. Redemption is server-side only (Tachyon-run effects).
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/SecretRequest'}}}
      responses:
        "201": {description: stored, content: {application/json: {schema: {$ref: '#/components/schemas/SecretRef'}}}}
        "503": {$ref: '#/components/responses/Error'}
  /openapi.yaml:
    get:
      summary: This document (stub only)
      responses:
        "200": {description: ok}
components:
  parameters:
    id: {name: id, in: path, required: true, schema: {type: string}}
  responses:
    Error:
      description: error
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  schemas:
    Risk: {type: string, enum: [low, medium, high]}
    Group: {type: string, enum: [command, change, destructive, question, form, secret, notice, info]}
    BatchBlocker:
      type: string
      enum: [not_pending, kind_not_batchable, risk_not_low, interactive, has_secret, command_exec, destructive, no_effects_declared, irreversible_effect, expired, deferred, needs_operator_access]
    Error:
      type: object
      required: [code, message]
      properties:
        code: {type: string, enum: [stale_revision, already_resolved, batch_id_reuse, confirmation_required, reason_required, invalid_secret_ref, operator_access_required, requester_cannot_approve, session_required, secrets_unavailable, rate_limited, invalid, not_found, internal]}
        message: {type: string}
        revision: {type: integer, description: actual revision on stale_revision / already_resolved}
        terminal_outcome: {type: object, description: existing outcome on already_resolved}
    Effect:
      type: object
      required: [target]
      properties: {target: {type: string}, op: {type: string}, summary: {type: string}, value: {}}
    Evidence:
      type: object
      required: [ref, label, kind]
      properties:
        ref: {type: string}
        label: {type: string}
        kind: {type: string, enum: [path, caster, torque, tesseract, url, chat]}
        note: {type: string}
    AffectedItem:
      type: object
      required: [ref, label, kind]
      properties: {ref: {type: string}, label: {type: string}, kind: {type: string}, note: {type: string}}
    Confirm:
      type: object
      required: [phrase]
      properties:
        phrase: {type: string, description: "server-derived; case-sensitive, trimmed"}
    Destructive:
      type: object
      required: [irreversible, summary]
      properties:
        irreversible: {type: boolean}
        summary: {type: string}
    Alternative:
      type: object
      required: [id, label, effects]
      properties: {id: {type: string}, label: {type: string}, effects: {type: array, items: {$ref: '#/components/schemas/Effect'}}}
    Item:
      type: object
      description: The existing item view (contract_version, item_id, state, revision, request_snapshot, enqueued_at, updated_at, terminal_outcome) plus the projection.
      required: [item_id, state, revision, presented_projection_revision, kind, title, risk, group, batchable, batch_blockers, server_now_ms]
      properties:
        contract_version: {type: string}
        item_id: {type: string}
        state: {type: string, enum: [submitted, validated, staged, presented, in_progress, resolved, canceled, expired, failed, superseded]}
        revision: {type: integer}
        presented_projection_revision: {type: integer}
        request_snapshot: {type: object}
        enqueued_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        terminal_outcome: {type: object}
        kind: {type: string}
        title: {type: string}
        summary: {type: string}
        requester:
          type: object
          properties: {id: {type: string}, label: {type: string}, kind: {type: string}}
        session_ref: {type: string}
        asked_at: {type: string, format: date-time}
        risk: {$ref: '#/components/schemas/Risk'}
        risk_reasons: {type: array, items: {type: string, enum: [effects_present, secret_field, interactive, destructive, command_exec]}}
        group: {$ref: '#/components/schemas/Group'}
        batchable: {type: boolean, description: "computed by the server; meaningful for pending items only"}
        batch_blockers: {type: array, items: {$ref: '#/components/schemas/BatchBlocker'}}
        effect_classes: {type: array, items: {type: string, enum: [create, update, restart, delete, archive, run, other]}}
        expires_at: {type: string, format: date-time, nullable: true}
        server_now_ms: {type: integer, description: use for countdowns, not the browser clock}
        deferred_until: {type: string, format: date-time, nullable: true}
        run_state: {type: string, enum: [none, waiting, approved, starting, running, succeeded, failed, refused, expired]}
        evidence: {type: array, maxItems: 16, items: {$ref: '#/components/schemas/Evidence'}}
        affected_items: {type: array, maxItems: 200, items: {$ref: '#/components/schemas/AffectedItem'}}
        affected_total: {type: integer}
        destructive: {allOf: [{$ref: '#/components/schemas/Destructive'}], nullable: true}
        alternatives: {type: array, maxItems: 3, items: {$ref: '#/components/schemas/Alternative'}}
        recommendation: {type: string, nullable: true}
        reason_required: {type: boolean}
        confirm: {allOf: [{$ref: '#/components/schemas/Confirm'}], nullable: true, description: "present on every high-class item and every destructive one; approve must send response.confirmation equal to confirm.phrase unless alternative_id is set"}
    Inbox:
      type: object
      required: [pending, history, synced_at, server_now_ms, revision, counts]
      properties:
        pending: {type: array, items: {$ref: '#/components/schemas/Item'}}
        history: {type: array, items: {$ref: '#/components/schemas/Item'}}
        next_pending: {type: string, nullable: true}
        next_history: {type: string, nullable: true}
        synced_at: {type: string, format: date-time}
        server_now_ms: {type: integer}
        revision: {type: string}
        counts:
          type: object
          properties:
            pending: {type: integer}
            batchable: {type: integer}
            deferred: {type: integer}
            by_group: {type: object, additionalProperties: {type: integer}}
            by_risk: {type: object, additionalProperties: {type: integer}}
    ResolveRequest:
      type: object
      required: [expected_revision, response]
      properties:
        expected_revision: {type: integer, minimum: 1}
        presented_projection_revision: {type: integer}
        connection_id: {type: string}
        response:
          type: object
          required: [decision]
          properties:
            kind: {type: string}
            decision: {type: string}
            note: {type: string}
            reply: {type: string}
            confirmation: {type: string, description: the typed phrase for a destructive approval}
            alternative_id: {type: string, description: resolves as approved with this alternative's effects}
            answers: {}
            decisions: {}
            payload: {}
    ResolveResult:
      type: object
      required: [item_id, state, revision, terminal_outcome]
      properties:
        item_id: {type: string}
        state: {type: string}
        revision: {type: integer}
        terminal_outcome: {type: object}
        run_state: {type: string}
    DeferRequest:
      type: object
      required: [expected_revision]
      properties:
        expected_revision: {type: integer}
        duration_s: {type: integer, minimum: 60, maximum: 604800, default: 3600}
        until_ms: {type: integer}
        reason: {type: string, maxLength: 280}
    DeferResult:
      type: object
      required: [item_id, deferred_until]
      properties:
        item_id: {type: string}
        deferred_until: {type: string, format: date-time, nullable: true}
        expires_before_snooze_ends: {type: boolean}
        revision: {type: integer}
    BatchRequest:
      type: object
      required: [batch_id, decision, items]
      properties:
        batch_id: {type: string, description: client-generated UUID}
        decision: {type: string, enum: [approved, denied]}
        note: {type: string}
        items:
          type: array
          minItems: 1
          maxItems: 25
          items:
            type: object
            required: [item_id, expected_revision]
            properties: {item_id: {type: string}, expected_revision: {type: integer}, presented_projection_revision: {type: integer}}
    BatchResult:
      type: object
      required: [batch_id, results, counts, completed_at]
      properties:
        batch_id: {type: string}
        results:
          type: array
          items:
            type: object
            required: [item_id, status]
            properties:
              item_id: {type: string}
              status: {type: string, enum: [resolved, stale, ineligible, expired, conflict, error]}
              decision: {type: string}
              revision: {type: integer}
              resolution_id: {type: string}
              blockers: {type: array, items: {$ref: '#/components/schemas/BatchBlocker'}}
              error: {type: object, properties: {code: {type: string}, message: {type: string}}}
              run_state: {type: string}
        counts: {type: object, additionalProperties: {type: integer}}
        completed_at: {type: string, format: date-time}
    Event:
      type: object
      required: [event_id, ts, item_id, kind]
      properties:
        event_id: {type: string}
        ts: {type: string, format: date-time}
        item_id: {type: string}
        kind: {type: string, enum: [presented, deferred, undeferred, resolved, batch_resolved, expired, withdrawn, confirmation_failed, access_denied]}
        actor: {type: object, properties: {ref: {type: string}, label: {type: string}, assurance: {type: string}}}
        decision: {type: string}
        note: {type: string}
        reason_code: {type: string}
        batch_id: {type: string}
        revision: {type: integer}
    History:
      type: object
      required: [events, total]
      properties:
        events:
          type: array
          items:
            type: object
            required: [event_id, item_id, kind, status, at, mini]
            properties:
              event_id: {type: string}
              item_id: {type: string}
              kind: {type: string}
              decision: {type: string, nullable: true}
              status: {type: string}
              actor: {type: object}
              at: {type: string, format: date-time}
              note: {type: string, nullable: true}
              reason: {type: string, nullable: true}
              batch_id: {type: string, nullable: true}
              mini:
                type: object
                properties: {title: {type: string}, risk: {$ref: '#/components/schemas/Risk'}, group: {$ref: '#/components/schemas/Group'}}
        next_cursor: {type: string, nullable: true}
        total: {type: integer}
    Access:
      type: object
      required: [state, can_elevate, required_for]
      properties:
        state: {type: string, enum: [none, elevated]}
        expires_in_s: {type: integer}
        can_elevate: {type: boolean}
        ttl_policy: {type: string}
        required_for:
          type: object
          properties: {batch: {type: boolean}, medium: {type: boolean}, destructive: {type: boolean}}
    SecretRequest:
      type: object
      required: [item_id, field, value]
      properties: {item_id: {type: string}, field: {type: string}, value: {type: string, maxLength: 16384}}
    SecretRef:
      type: object
      required: [secret_ref, created_at, expires_at, fingerprint]
      properties:
        secret_ref: {type: string, pattern: '^secret://tachyon/[a-z0-9_]+$'}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        fingerprint: {type: string, description: "sha256: plus first 8 hex"}
        size: {type: integer}
